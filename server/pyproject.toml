[project]
name = "hangyul-univ-api"
version = "0.1.0"
description = "Hangyul Univ platform API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",  # RS256 id_token validation for SSO
  "httpx>=0.27",  # OIDC discovery / token exchange
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "cryptography>=42",  # AES-256-GCM envelopes (payment credentials, V29 MFA secrets)
  "pyotp>=2.9",  # V29 staff TOTP
  "boto3>=1.34",  # V29 S3 / MinIO private object storage
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3,server]>=5.0"]  # moto: V29 S3 adapter tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
