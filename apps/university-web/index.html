<!doctype html>
<html lang="en" dir="ltr" data-surface="console" data-product="university"
  data-nav-layout="vertical" data-theme-mode="light" data-header-styles="light" data-menu-styles="light" data-vertical-style="overlay"
  data-page-style="regular" data-width="fullwidth" data-menu-position="fixed" data-header-position="fixed">
<!-- V26 (REPORT §348): the YNEX layout state is on <html> from the first paint. YnexShell sets the same values after mount;
     before V26 the first frame laid the page out without them and the whole content jumped 30 px (CLS). -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- The product is light-only: stop device/browser auto-dark from repainting it (invisible text, inverted controls). -->
    <meta name="color-scheme" content="only light" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Hangyul Univ — University Console</title>
    <meta name="description" content="Hangyul Univ console for partner universities. Sign in required." />
    <!-- Generic product-level social card only: this app is signed-in, so nothing page- or person-specific is ever
         put in metadata. The image is the canonical Hangyul Univ card on the public site (docs/BRAND_AND_MEDIA.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hangyul Univ" />
    <meta property="og:title" content="Hangyul Univ" />
    <meta property="og:description" content="Hangyul Univ console for partner universities. Sign in required." />
    <meta property="og:url" content="https://partner.univ.talkhangyul.com/" />
    <meta property="og:image" content="https://univ.talkhangyul.com/og/hangyul-univ-og-v1.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hangyul Univ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hangyul Univ" />
    <meta name="twitter:description" content="Hangyul Univ console for partner universities. Sign in required." />
    <meta name="twitter:image" content="https://univ.talkhangyul.com/og/hangyul-univ-og-v1.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
