<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFDF8" />
    <!-- The product is light-only: stop device/browser auto-dark from repainting it (invisible text, inverted controls). -->
    <meta name="color-scheme" content="only light" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Hangyul Univ — Student</title>
    <meta name="description" content="Sign in to Hangyul Univ to prepare your studies in Korea." />
    <!-- Generic product-level social card only: this app is signed-in, so nothing page- or person-specific is ever
         put in metadata. The image is the canonical Hangyul Univ card on the public site (docs/BRAND_AND_MEDIA.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hangyul Univ" />
    <meta property="og:title" content="Hangyul Univ" />
    <meta property="og:description" content="Sign in to Hangyul Univ to prepare your studies in Korea." />
    <meta property="og:url" content="https://app.univ.talkhangyul.com/" />
    <meta property="og:image" content="https://univ.talkhangyul.com/og/hangyul-univ-og-v1.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hangyul Univ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hangyul Univ" />
    <meta name="twitter:description" content="Sign in to Hangyul Univ to prepare your studies in Korea." />
    <meta name="twitter:image" content="https://univ.talkhangyul.com/og/hangyul-univ-og-v1.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
